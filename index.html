<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>EPS-TOPIK Vocabulary Flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --surface:#fffdf8; --ink:#1d1b26; --muted:#6d6878; --line:#e3ddd0;
  --accent:#d6453d; --accent2:#2f5d8a; --good:#2f8a5b; --bad:#d6453d; --chip:#efe9dc;
  --shadow:0 10px 30px -12px rgba(30,20,10,.25);
}
@media (prefers-color-scheme: dark){
  :root{--bg:#15141b;--surface:#1f1d27;--ink:#f2efe8;--muted:#a29dad;--line:#2f2c3a;--chip:#2a2733;--shadow:0 10px 30px -12px rgba(0,0,0,.6)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans","Noto Sans KR",system-ui,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);min-height:100vh}
.app{max-width:520px;margin:0 auto;padding:16px 16px 96px}
.kr{font-family:"Noto Sans KR",sans-serif}
header.top{display:flex;align-items:center;gap:10px;margin:6px 0 14px}
header.top h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.02em}
header.top .sub{font-size:12px;color:var(--muted)}
.logo{width:40px;height:40px;border-radius:12px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px;font-family:"Noto Sans KR"}
.iconbtn{border:none;background:var(--chip);color:var(--ink);width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;display:grid;place-items:center}
.spacer{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:none;background:none;padding:10px;border-radius:10px;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px -4px rgba(0,0,0,.3)}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;margin-bottom:12px}
.deck{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.deck:active{transform:scale(.99)}
.deck .num{width:36px;height:36px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-weight:800;font-size:13px;flex-shrink:0}
.deck .t{font-weight:700;font-size:15px;line-height:1.2}
.deck .k{font-size:12px;color:var(--muted)}
.deck .bar{height:4px;background:var(--chip);border-radius:4px;margin-top:6px;overflow:hidden}
.deck .bar i{display:block;height:100%;background:var(--good)}
.deck .cnt{font-size:12px;color:var(--muted);text-align:right;flex-shrink:0}
.allbtn{width:100%;border:none;border-radius:16px;padding:14px;font:inherit;font-weight:800;background:var(--ink);color:var(--bg);margin-bottom:12px;cursor:pointer}
.row{display:flex;gap:8px;margin-bottom:12px}
.row .allbtn{margin:0}
.allbtn.alt{background:var(--chip);color:var(--ink)}
/* Study */
.studyhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.studyhead .ttl{font-weight:800;font-size:16px;line-height:1.2}
.studyhead .ttl small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.progress{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.cardwrap{perspective:1200px;height:min(58vh,420px);margin-bottom:14px;touch-action:pan-y}
.card{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d;cursor:pointer}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .main{font-size:clamp(34px,11vw,54px);font-weight:900;line-height:1.15;word-break:keep-all}
.face .main.en{font-size:clamp(24px,7vw,34px);font-weight:800}
.face .pic{font-size:clamp(110px,38vw,170px);line-height:1}
.face .backpic{font-size:44px;margin-bottom:6px}
.li .em{font-size:26px;width:34px;text-align:center;flex-shrink:0}
.face .rom{color:var(--muted);margin-top:8px;font-size:15px}
.face .hint{position:absolute;bottom:16px;font-size:12px;color:var(--muted)}
.face .tag{position:absolute;top:16px;left:16px;font-size:11px;background:var(--chip);padding:4px 8px;border-radius:8px;color:var(--muted)}
.face .spk{position:absolute;top:12px;right:12px}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctrl button{border:none;border-radius:16px;padding:16px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;color:#fff}
.b-bad{background:var(--bad)}.b-good{background:var(--good)}
.subctrl{display:flex;justify-content:space-between;margin-top:10px}
.subctrl button{border:none;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px;cursor:pointer}
.swipe-l{animation:sl .25s forwards}.swipe-r{animation:sr .25s forwards}
@keyframes sl{to{transform:translateX(-120%) rotate(-12deg);opacity:0}}
@keyframes sr{to{transform:translateX(120%) rotate(12deg);opacity:0}}
/* quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px 20px;text-align:center;box-shadow:var(--shadow);margin-bottom:14px}
.q .main{font-size:clamp(30px,10vw,48px);font-weight:900}
.q .main.en{font-size:clamp(22px,6vw,30px)}
.opts{display:grid;gap:8px}
.opts button{border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px;font:inherit;font-weight:600;font-size:15px;text-align:left;cursor:pointer}
.opts button.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--surface))}
.opts button.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--surface))}
.done{text-align:center;padding:40px 10px}
.done .big{font-size:56px;font-weight:900}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border:none}
.li .kr{font-weight:700;font-size:17px}
.li .en{color:var(--muted);font-size:14px;text-align:right}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet.on{display:flex}
.sheet .in{background:var(--surface);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.opt:last-of-type{border:none}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:none;background:none;padding:6px 10px;border-radius:8px;font:inherit;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink)}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:14px}
.secthead{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 4px 8px}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>

const PIC={};
(function(){
  const seg=new Intl.Segmenter?new Intl.Segmenter("en",{granularity:"grapheme"}):null;
  for(const line of PIC_RAW.split("\n")){
    // split by space but keys may contain spaces: parse greedily — key text is Korean/latin; emoji is the final grapheme of each token group
    let buf="";
    const toks=line.split(" ");
    for(const t of toks){
      buf=buf?buf+" "+t:t;
      const g=seg?[...seg.segment(buf)].map(x=>x.segment):Array.from(buf);
      const last=g[g.length-1];
      if(last && /\p{Extended_Pictographic}|⃣|[\u{1F1E6}-\u{1F1FF}]|⬜|⬛|➕|➰/u.test(last)){
        const key=g.slice(0,-1).join("").trim(); if(key) PIC[key]=last; buf="";
      }
    }
  }
})();
function picOf(c){return PIC[c.k+"|"+c.e]||PIC[c.k]||null}

/* ================= DATA PREP ================= */
function parse(decks, book){
  return decks.map(([id,en,kr,raw],i)=>({
    id,en,kr,book,n:i+1,
    cards: raw.split(";").map(s=>s.trim()).filter(Boolean).map((s,j)=>{
      const [k,e]=s.split("|"); return {id:id+"-"+j,k:k.trim(),e:(e||"").trim(),deck:id};
    })
  }));
}
const DECKS=[...parse(BOOK1,1),...parse(BOOK2,2)];
const ALL=DECKS.flatMap(d=>d.cards);
const BYID=Object.fromEntries(ALL.map(c=>[c.id,c]));

/* Revised Romanization (simplified, letter-by-letter with basic final consonants) */
const CHO=["g","kk","n","d","tt","r","m","b","pp","s","ss","","j","jj","ch","k","t","p","h"];
const JUNG=["a","ae","ya","yae","eo","e","yeo","ye","o","wa","wae","oe","yo","u","wo","we","wi","yu","eu","ui","i"];
const JONG=["","k","k","k","n","n","n","t","l","k","m","l","l","l","p","l","m","p","p","t","t","ng","t","t","k","t","p","t"];
function romanize(s){
  let out="",prevJong=-1;
  for(const ch of s){
    const c=ch.charCodeAt(0);
    if(c>=0xAC00&&c<=0xD7A3){
      const x=c-0xAC00, cho=Math.floor(x/588), jung=Math.floor((x%588)/28), jong=x%28;
      let first=CHO[cho];
      if(cho===5) first=(prevJong===8?"l":"r");
      if(cho===11&&prevJong>0){ // liaison: carry final consonant forward
        const carry={1:"g",4:"n",7:"d",8:"r",16:"m",17:"b",19:"s",21:"ng",22:"j",23:"ch",25:"t",26:"p"};
        if(carry[prevJong]!==undefined && prevJong!==21){
          out=out.slice(0,out.length-JONG[prevJong].length)+carry[prevJong];
        }
      }
      out+=first+JUNG[jung]+JONG[jong]; prevJong=jong;
    } else { out+=ch; prevJong=-1; }
  }
  return out;
}

const store={get(k,d){try{const v=localStorage.getItem("eps_"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("eps_"+k,JSON.stringify(v))}catch(e){}}};
let known=store.get("known",{});      // id -> true
let settings=Object.assign({front:"pic",auto:false},store.get("settings",{}));
if(settings.v!==2){settings.front="pic";settings.v=2;}
let view={name:"home",tab:1,q:""};
let session=null;

function save(){store.set("known",known);store.set("settings",settings)}
function deckKnown(d){return d.cards.filter(c=>known[c.id]).length}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

/* ================= SPEECH ================= */
let koVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices();koVoice=v.find(x=>/ko/i.test(x.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\(.*?\)/g,""));u.lang="ko-KR";if(koVoice)u.voice=koVoice;u.rate=.85;speechSynthesis.speak(u)}catch(e){}}

const app=document.getElementById("app");
function render(){
  if(view.name==="home") return renderHome();
  if(view.name==="study") return renderStudy();
  if(view.name==="quiz") return renderQuiz();
  if(view.name==="list") return renderList();
}

function renderHome(){
  const total=ALL.length, k=Object.keys(known).filter(id=>BYID[id]).length;
  const decks=DECKS.filter(d=>d.book===view.tab);
  const q=view.q.trim().toLowerCase();
  let body="";
  if(q){
    const hits=ALL.filter(c=>c.k.includes(q)||c.e.toLowerCase().includes(q)||romanize(c.k).includes(q)).slice(0,80);
    body=`<div class="secthead">${hits.length} result${hits.length===1?"":"s"}</div><div class="list">${hits.map(c=>`
      <div class="li" data-say="${esc(c.k)}"><div class="em">${picOf(c)||""}</div><div style="flex:1"><div class="kr">${esc(c.k)}</div></div><div class="en">${esc(c.e)}</div></div>`).join("")||'<div class="li">No matches</div>'}</div>`;
  } else {
    const bk=decks.reduce((a,d)=>a+d.cards.length,0), bkn=decks.reduce((a,d)=>a+deckKnown(d),0);
    body=`
      <div class="row">
        <button class="allbtn" data-act="studybook">▶ Study Book ${view.tab} (${bk})</button>
        <button class="allbtn alt" data-act="quizbook" style="flex:0 0 34%">Quiz</button>
      </div>
      <button class="allbtn alt" data-act="picbook" style="margin-bottom:8px">🖼 Picture cards · Book ${view.tab} (${decks.flatMap(d=>d.cards).filter(picOf).length})</button>
      <button class="allbtn alt" data-act="review" style="margin-bottom:6px">↻ Review words not yet known (${ALL.length-k})</button>
      <div class="secthead">Book ${view.tab} · ${view.tab===1?"Daily Life 일상생활":"Workplace Life 직장생활"} · ${bkn}/${bk} known</div>
      ${decks.map(d=>{const kk=deckKnown(d),p=Math.round(kk/d.cards.length*100);return `
      <div class="deck" data-deck="${d.id}">
        <div class="num">${d.n}</div>
        <div style="flex:1;min-width:0"><div class="t">${esc(d.en)}</div><div class="k kr">${esc(d.kr)}</div><div class="bar"><i style="width:${p}%"></i></div></div>
        <div class="cnt">${kk}/${d.cards.length}</div>
      </div>`}).join("")}`;
  }
  app.innerHTML=`
    <header class="top">
      <div class="logo">한</div>
      <div><h1>EPS-TOPIK Vocab</h1><div class="sub">Books 1 & 2 · ${total} words</div></div>
      <div class="spacer"></div>
      <button class="iconbtn" data-act="settings" aria-label="Settings">⚙</button>
    </header>
    <div class="stats">
      <div class="stat"><b>${k}</b><span>Known</span></div>
      <div class="stat"><b>${total-k}</b><span>To learn</span></div>
      <div class="stat"><b>${Math.round(k/total*100)}%</b><span>Done</span></div>
    </div>
    <div class="tabs"><button class="${view.tab===1?"on":""}" data-tab="1">Book 1</button><button class="${view.tab===2?"on":""}" data-tab="2">Book 2</button></div>
    <input class="search" id="search" placeholder="Search Korean or English…" value="${esc(view.q)}" autocomplete="off">
    ${body}`;
  const s=document.getElementById("search");
  s.oninput=()=>{view.q=s.value;const pos=s.selectionStart;render();const n=document.getElementById("search");n.focus();n.setSelectionRange(pos,pos)};
}

function startStudy(cards,title,sub,deckId){
  session={cards:shuffle(cards),i:0,flip:false,title,sub,deckId,good:0,bad:0,missed:[]};
  view.name="study";render();
}
function renderStudy(){
  const s=session, c=s.cards[s.i];
  if(!c){
    app.innerHTML=`<div class="done"><div class="big">🎉</div><h2>Session complete</h2>
      <p style="color:var(--muted)">${s.good} known · ${s.bad} to review</p>
      ${s.missed.length?`<button class="allbtn" data-act="again">Review ${s.missed.length} missed words</button>`:""}
      <button class="allbtn alt" data-act="home">Back to decks</button></div>`;return;
  }
  const pic=picOf(c);
  const picMode=settings.front==="pic"&&pic;
  const frontKr=settings.front==="kr"||(settings.front==="pic"&&!pic)||(settings.front==="mix"&&(c.id.charCodeAt(c.id.length-1)%2));
  const krFace=`<div class="main kr">${esc(c.k)}</div>`;
  const enFace=`<div class="main en">${esc(c.e)}</div>`;
  const picFront=`<div class="pic">${pic}</div>`;
  const picBack=`<div class="backpic">${pic}</div><div class="main kr">${esc(c.k)}</div><div class="rom" style="margin-top:12px;font-size:18px">${esc(c.e)}</div>`;
  const deck=DECKS.find(d=>d.id===c.deck);
  app.innerHTML=`
    <div class="studyhead"><button class="iconbtn" data-act="home">←</button>
      <div class="ttl">${esc(s.title)}<small>${esc(s.sub)}</small></div><div class="spacer"></div>
      <div style="font-weight:800">${s.i+1}/${s.cards.length}</div></div>
    <div class="progress"><i style="width:${s.i/s.cards.length*100}%"></i></div>
    <div class="cardwrap" id="wrap"><div class="card ${s.flip?"flip":""}" id="card">
      <div class="face front"><span class="tag">B${deck.book}·${deck.n} ${esc(deck.en)}</span>
        <button class="iconbtn spk" data-say="${esc(c.k)}">🔊</button>
        ${picMode?picFront:frontKr?krFace:enFace}<div class="hint">Tap to flip · swipe ← → to grade</div></div>
      <div class="face back"><span class="tag">${known[c.id]?"✓ known":"answer"}</span>
        <button class="iconbtn spk" data-say="${esc(c.k)}">🔊</button>
        ${picMode?picBack:(frontKr?enFace:krFace)+(frontKr?`<div class="rom kr" style="margin-top:14px">${esc(c.k)}</div>`:"")}</div>
    </div></div>
    <div class="ctrl"><button class="b-bad" data-act="bad">✗ Still learning</button><button class="b-good" data-act="good">✓ I know it</button></div>
    <div class="subctrl"><button data-act="prev">← Previous</button><button data-act="skip">Skip →</button></div>`;
  if(settings.auto&&frontKr&&!picMode&&!s.flip) speak(c.k);
  bindSwipe();
}
function grade(ok){
  const s=session,c=s.cards[s.i]; if(!c)return;
  if(ok){known[c.id]=true;s.good++}else{delete known[c.id];s.bad++;s.missed.push(c)}
  save();
  const card=document.getElementById("card");
  if(card){card.classList.add(ok?"swipe-r":"swipe-l");setTimeout(()=>{s.i++;s.flip=false;render()},220)}else{s.i++;s.flip=false;render()}
}
function bindSwipe(){
  const w=document.getElementById("wrap");if(!w)return;let x0=null,y0=null;
  w.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
  w.addEventListener("touchend",e=>{if(x0===null)return;const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)){grade(dx>0)}x0=null},{passive:true});
}

/* Quiz */
function startQuiz(cards,title){
  const qs=shuffle(cards).slice(0,20).map(c=>{
    const pool=ALL.filter(x=>x.e!==c.e&&x.k!==c.k);
    const same=pool.filter(x=>x.deck===c.deck);
    const distract=shuffle(same.length>=3?same:pool).slice(0,3);
    const dir=Math.random()<.5?"k2e":"e2k";
    return {c,dir,opts:shuffle([c,...distract]),ans:null};
  });
  session={quiz:qs,i:0,score:0,title};view.name="quiz";render();
}
function renderQuiz(){
  const s=session,q=s.quiz[s.i];
  if(!q){const p=Math.round(s.score/s.quiz.length*100);
    app.innerHTML=`<div class="done"><div class="big">${p}%</div><h2>${s.score} / ${s.quiz.length} correct</h2>
    <p style="color:var(--muted)">${p>=80?"Excellent! 잘했어요!":p>=50?"Good effort — keep going! 화이팅!":"Keep practicing — 다시 해 봐요!"}</p>
    <button class="allbtn" data-act="quizagain">New quiz</button><button class="allbtn alt" data-act="home">Back to decks</button></div>`;return}
  const qp=picOf(q.c);const prompt=(qp&&q.dir==="e2k"?`<div style="font-size:72px;line-height:1.1;margin-bottom:6px">${qp}</div>`:"")+(q.dir==="k2e"?`<div class="main kr">${esc(q.c.k)}</div>`:`<div class="main en">${esc(q.c.e)}</div>`);
  app.innerHTML=`
    <div class="studyhead"><button class="iconbtn" data-act="home">←</button>
      <div class="ttl">Quiz<small>${esc(s.title)}</small></div><div class="spacer"></div><div style="font-weight:800">${s.i+1}/${s.quiz.length}</div></div>
    <div class="progress"><i style="width:${s.i/s.quiz.length*100}%"></i></div>
    <div class="q"><div style="font-size:12px;color:var(--muted);margin-bottom:10px">${q.dir==="k2e"?"What does this mean?":"Choose the Korean word"}</div>${prompt}
      ${q.dir==="k2e"?`<button class="iconbtn" style="margin:12px auto 0" data-say="${esc(q.c.k)}">🔊</button>`:""}</div>
    <div class="opts">${q.opts.map((o,i)=>{
      let cls="";if(q.ans!==null){if(o.id===q.c.id)cls="ok";else if(i===q.ans)cls="no"}
      return `<button class="${cls} ${q.dir==="e2k"?"kr":""}" data-opt="${i}">${esc(q.dir==="k2e"?o.e:o.k)}</button>`}).join("")}</div>
    ${q.ans!==null?`<button class="allbtn" style="margin-top:12px" data-act="next">Next →</button>`:""}`;
}

function renderList(){
  const d=DECKS.find(x=>x.id===view.deck);
  app.innerHTML=`
    <div class="studyhead"><button class="iconbtn" data-act="home">←</button>
      <div class="ttl">${esc(d.en)}<small class="kr">Book ${d.book} · ${esc(d.kr)} · ${d.cards.length} words</small></div></div>
    <div class="row"><button class="allbtn" data-act="studydeck">▶ Flashcards</button><button class="allbtn alt" data-act="quizdeck">Quiz</button></div>
    <div class="list">${d.cards.map(c=>`
      <div class="li" data-say="${esc(c.k)}"><div class="em">${picOf(c)||""}</div><div style="flex:1"><div class="kr">${known[c.id]?"✓ ":""}${esc(c.k)}</div></div><div class="en">${esc(c.e)}</div></div>`).join("")}</div>
    <div class="note">Tap any word to hear it.</div>`;
}

/* Settings sheet */
const sheet=document.getElementById("sheet"),sheetIn=document.getElementById("sheetIn");
function openSettings(){
  const seg=(key,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button class="${settings[key]===v?"on":""}" data-set="${key}" data-val='${JSON.stringify(v)}'>${l}</button>`).join("")}</div>`;
  sheetIn.innerHTML=`<h3>Settings</h3>
    <div class="opt"><span>Card front</span>${seg("front",[["pic","🖼"],["kr","한국어"],["en","EN"],["mix","Mix"]])}</div>
        <div class="opt"><span>Auto-play audio</span>${seg("auto",[[true,"On"],[false,"Off"]])}</div>
    <button class="allbtn alt" data-act="reset" style="margin-top:14px">Reset all progress</button>
    <button class="allbtn" data-act="close">Done</button>
    <p class="note">Vocabulary is organized by the topics of the NEW EPS-TOPIK Standard Textbook (Book 1 Daily Life, Book 2 Workplace Life) and covers the core words for each theme. audio uses your device's Korean voice if installed. Pictures are emoji drawn by your phone, so they look slightly different on Android and iPhone. Progress is saved on this device.</p>`;
  sheet.classList.add("on");
}
let resetArmed=false;

/* ================= EVENTS ================= */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab],[data-deck],[data-say],[data-opt],[data-set]");
  if(e.target===sheet){sheet.classList.remove("on");return}
  if(!t){ if(e.target.closest("#card")){session.flip=!session.flip;document.getElementById("card").classList.toggle("flip");const cc=session.cards[session.i];if(session.flip&&settings.auto&&cc)speak(cc.k)} return }
  if(t.dataset.say!==undefined&&!t.dataset.act){e.stopPropagation();speak(t.dataset.say);return}
  if(t.dataset.tab){view.tab=+t.dataset.tab;render();return}
  if(t.dataset.deck){view.name="list";view.deck=t.dataset.deck;render();window.scrollTo(0,0);return}
  if(t.dataset.set){settings[t.dataset.set]=JSON.parse(t.dataset.val);save();openSettings();return}
  if(t.dataset.opt!==undefined){const q=session.quiz[session.i];if(q.ans!==null)return;q.ans=+t.dataset.opt;
    if(q.opts[q.ans].id===q.c.id){session.score++;known[q.c.id]=true}else{delete known[q.c.id]} save();speak(q.c.k);render();return}
  const a=t.dataset.act;
  const bookCards=()=>DECKS.filter(d=>d.book===view.tab).flatMap(d=>d.cards);
  if(a==="home"){view.name=view.name==="study"&&session.deckId?"list":"home";if(view.name==="list")view.deck=session.deckId;try{speechSynthesis.cancel()}catch(_){}render();window.scrollTo(0,0)}
  else if(a==="studybook")startStudy(bookCards(),`Book ${view.tab}`,view.tab===1?"Daily Life":"Workplace Life");
  else if(a==="picbook"){settings.front="pic";save();startStudy(bookCards().filter(picOf),`Book ${view.tab} · Pictures`,"Guess the word from the picture")}
  else if(a==="quizbook")startQuiz(bookCards(),`Book ${view.tab}`);
  else if(a==="review"){const c=ALL.filter(x=>!known[x.id]);if(c.length)startStudy(c.slice(0,400),"Review","Words not yet known")}
  else if(a==="studydeck"){const d=DECKS.find(x=>x.id===view.deck);startStudy(d.cards,d.en,d.kr,d.id)}
  else if(a==="quizdeck"){const d=DECKS.find(x=>x.id===view.deck);startQuiz(d.cards,d.en)}
  else if(a==="good")grade(true);
  else if(a==="bad")grade(false);
  else if(a==="skip"){session.i++;session.flip=false;render()}
  else if(a==="prev"){if(session.i>0){session.i--;session.flip=false;render()}}
  else if(a==="again"){startStudy(session.missed,session.title,"Missed words",session.deckId)}
  else if(a==="next"){session.i++;render()}
  else if(a==="quizagain"){startQuiz(ALL.filter(c=>session.quiz.some(q=>q.c.deck===c.deck)),session.title)}
  else if(a==="settings")openSettings();
  else if(a==="close")sheet.classList.remove("on");
  else if(a==="reset"){if(!resetArmed){resetArmed=true;t.textContent="Tap again to confirm reset";t.style.background="var(--bad)";t.style.color="#fff";return}
    known={};save();resetArmed=false;sheet.classList.remove("on");render()}
});
document.addEventListener("keydown",e=>{
  if(view.name!=="study")return;
  if(e.key===" "){e.preventDefault();session.flip=!session.flip;document.getElementById("card")?.classList.toggle("flip")}
  if(e.key==="ArrowRight")grade(true); if(e.key==="ArrowLeft")grade(false);
});
render();
</script>
</body>
</html>
